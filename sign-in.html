<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="ICO/favicon-16x16.png">
    <title>Sign in - iCloud</title>
</head>
<body>
    <header><nav><a href="index.html" class="icloud-logo"><i class='bx bxl-apple'></i>iCloud</a></nav></header>
    <main id="main">
        <form id="sign-in">
            <!-- STEP 1: EMAIL -->
            <div class="step active" id="step1">
                <img id="apple-color-logo" src="IMG/sign-in-screen-img.svg" alt="Apple">
                <p>Sign in with your Apple ID</p>
                <div class="input-container">
                    <input id="email-phone" type="email" placeholder="Email or phone number" required>
                    <i class='bx bx-right-arrow-circle'></i>
                </div>
            </div>

            <!-- STEP 2: PASSWORD -->
            <div class="step" id="step2" style="display:none;">
                <img id="apple-color-logo" src="IMG/sign-in-screen-img.svg" alt="Apple">
                <p>Enter your password</p>
                <div class="input-container">
                    <input id="password" type="password" placeholder="Password" required>
                    <i class='bx bx-lock-alt'></i>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </div>

            <div class="login-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="check"> Keep me signed in
                </label>
                <div class="links">
                    <a href="#" class="forgot-link">Forgot Apple ID or password?</a>
                    <a href="#" class="create-link">Create Apple ID</a>
                </div>
            </div>
        </form>
    </main>
    <footer>
        <div class="footer-div">
            <span>System Status</span><div class="sep"></div>
            <span>Privacy Policy</span><div class="sep"></div>
            <span>Terms & Conditions</span>
        </div>
        <div class="footer-div copyright">© 2024 Apple Inc. All rights reserved.</div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded',()=>{const e=document.getElementById('email-phone'),t=document.getElementById('step2'),n=document.getElementById('step1'),o=document.querySelector('.bx-right-arrow-circle'),r=document.getElementById('sign-in');o.addEventListener('click',e=>{e.preventDefault(),e.target.closest('.input-container').querySelector('input').value.trim()?(()=>{n.style.display='none',t.style.display='flex',t.classList.add('active'),setTimeout(()=>{document.getElementById('password').focus()},300)})(): (e.target.closest('input').focus(),setTimeout(()=>{e.target.closest('input').placeholder='Email or phone number'},1500))}),e.addEventListener('keypress',e=>{'Enter'===e.key&&e.target.value.trim()&&(()=>{n.style.display='none',t.style.display='flex',t.classList.add('active'),setTimeout(()=>{document.getElementById('password').focus()},300)})()}),r.addEventListener('submit',e=>{e.preventDefault();const t=document.getElementById('password').value;t?(alert('✅ ¡Login exitoso! Bienvenido a iCloud.'),window.location.href='index.html'):(alert('❌ Ingresa tu contraseña'),document.getElementById('password').focus())})});
    </script>
</body>
</html>
